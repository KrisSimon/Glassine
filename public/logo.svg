<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img">
  <title>Glassine</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fd0" />
      <stop offset="1" stop-color="#153a72" />
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.62" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <!-- The backdrop: straight lines, so the panel above has something to bend. -->
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5">
    <path d="M0 9h32M0 16h32M0 23h32" />
  </g>
  <!-- The panel. -->
  <rect x="5" y="10" width="22" height="12" rx="6" fill="url(#glass)" />
  <rect x="5" y="10" width="22" height="12" rx="6" fill="none"
        stroke="#ffffff" stroke-opacity="0.85" stroke-width="0.75" />
  <rect x="7.5" y="11" width="10" height="4" rx="2" fill="#ffffff" fill-opacity="0.55" />
</svg>
