<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
  <!-- Image 5 — dark with points of light. Here the shadow does nothing;
       the specular edge is what carries the panel. -->
  <defs>
    <radialGradient id="night" cx="0.3" cy="0.7" r="0.9">
      <stop offset="0" stop-color="#2b2358" />
      <stop offset="1" stop-color="#0a0a12" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
    <filter id="grain5" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.2" numOctaves="3" seed="42" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#night)" />
  <g filter="url(#glow)" fill="#ffd9a0">
    <circle cx="240" cy="220" r="26" />
    <circle cx="520" cy="150" r="14" />
    <circle cx="900" cy="380" r="34" />
    <circle cx="1060" cy="700" r="18" />
    <circle cx="360" cy="640" r="22" />
  </g>
  <rect y="760" width="1200" height="140" fill="#05050a" />
  <rect width="1200" height="900" filter="url(#grain5)" opacity="0.2" />
</svg>
