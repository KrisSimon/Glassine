<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
  <!-- Image 4 — near-achromatic and bright. The hardest case: barely any
       colour for the filter to pull up into the panel. -->
  <defs>
    <linearGradient id="pale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#d7d4cd" />
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2.2" fill="#8d8a83" opacity="0.55" />
    </pattern>
    <filter id="grain4" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.7" numOctaves="1" seed="11" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#pale)" />
  <rect width="1200" height="900" fill="url(#dots)" />
  <rect x="120" y="180" width="420" height="540" fill="#1b1c1e" opacity="0.88" />
  <rect x="620" y="320" width="460" height="260" fill="#e2001a" opacity="0.9" />
  <rect width="1200" height="900" filter="url(#grain4)" opacity="0.1" />
</svg>
