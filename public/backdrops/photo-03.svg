<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">
  <!-- Image 3 — hard stripes. Tests for moiré and edge shimmer under blur. -->
  <defs>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123c2b" />
      <stop offset="1" stop-color="#4f8f52" />
    </linearGradient>
    <pattern id="stripes" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <rect width="34" height="34" fill="none" />
      <rect width="12" height="34" fill="#e9f2d8" opacity="0.55" />
    </pattern>
    <filter id="grain3" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="3" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#cool)" />
  <rect width="1200" height="900" fill="url(#stripes)" />
  <circle cx="880" cy="240" r="150" fill="#f6f3e7" opacity="0.9" />
  <rect width="1200" height="900" filter="url(#grain3)" opacity="0.12" />
</svg>
