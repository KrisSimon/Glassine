<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" width="2400" height="1200" role="img">
  <!-- Image 1 — hero: a soft gradient with a light source and grain.
       Tests whether the glass still carries over large, calm areas. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2f4c" />
      <stop offset="0.55" stop-color="#1f6a8c" />
      <stop offset="1" stop-color="#63b7ad" />
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.24" r="0.5">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.95" />
      <stop offset="0.45" stop-color="#ffb46a" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffb46a" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="2400" height="1200" fill="url(#sky)" />
  <rect width="2400" height="1200" fill="url(#sun)" />

  <!-- Horizontkanten: harte Übergänge für die Brechungsprobe -->
  <path d="M0 820 L900 700 L1500 780 L2400 660 L2400 1200 L0 1200 Z" fill="#0b2233" opacity="0.85" />
  <path d="M0 950 L700 880 L1400 940 L2400 850 L2400 1200 L0 1200 Z" fill="#071722" />

  <rect width="2400" height="1200" filter="url(#grain)" opacity="0.16" />
</svg>
