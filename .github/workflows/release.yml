name: Release

# Tag a commit to cut a release:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag is the source of truth for the version — package.json is rewritten
# to match before packing, so the tarball can never disagree with the tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Typecheck
        run: npm run check

      - name: Build the library
        run: npm run build:lib

      - name: Stamp the version from the tag
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      # `files: ["dist"]` in package.json keeps this to the built library.
      - name: Pack
        id: pack
        run: |
          tarball=$(npm pack --silent)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball"
          tar -tzf "$tarball" | head -40

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(cat <<'EOF'
          ## Install

          Download the tarball below and install it directly:

          ```sh
          npm install ./TARBALL
          ```

          ```svelte
          <script>
            import { GlassSurface } from "glassine";
          </script>

          <GlassSurface shape="pill">
            <span style="padding: 10px 20px">Hello</span>
          </GlassSurface>
          ```

          Components carry their own styling; `glassine/tokens/tokens.css` is
          optional and only needed to retheme them all at once.

          Requires Svelte 5 as a peer dependency.
          EOF
          )
          notes="${notes//TARBALL/${{ steps.pack.outputs.tarball }}}"

          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.pack.outputs.tarball }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "$notes" \
            --generate-notes
